plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.kaiku.cryptospot'
    compileSdk 33

    defaultConfig {
        applicationId "com.kaiku.cryptospot"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation(libs.androidx.core.ktx)

    implementation(platform(libs.compose.bom))
    implementation(libs.compose.ui.tooling)
    implementation(libs.compose.ui.preview)
    implementation(libs.compose.lifecycle.runtime)
    implementation(libs.compose.material)
    implementation(libs.compose.material3)
    implementation(libs.compose.viewmodel)
    implementation(libs.compose.koin)
    implementation(libs.compose.nav.animation)

    // Paging
    implementation libs.compose.paging
    implementation libs.compose.paging.runtime

    // Koin
    implementation libs.koin.core
    implementation libs.koin.android

    // Room
    implementation libs.room.ktx
    annotationProcessor libs.room.compiler
    implementation libs.room.paging

    // Test
    androidTestImplementation platform(libs.compose.bom)
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.preview
    testImplementation libs.junit
    androidTestImplementation libs.androidx.ui.test.junit4
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation libs.accompanist.systemuicontroller

    //ConstraintLayout
    implementation libs.androidx.constraintlayout.compose

    //network
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp

    //navigation-compose
    implementation libs.androidx.navigation.compose

    //Coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    implementation libs.timber

    implementation("org.burnoutcrew.composereorderable:reorderable:0.9.6")
}